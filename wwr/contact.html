<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting Company | Contact Us</title>
    <meta name="description"
      content="Contact White Water Rafting Company for information, reservations, questions, and assistance with your rafting adventure.">
    <meta name="author" content="Samson Yakubu">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-wwr-blue.jpg" alt="White water Rafting site logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-page">
        <section class="contact-info">
            <h1>Contact Us</h1>
            <h2>White Water Rafting Company</h2>
            <p>123 Main River Street</p>
            <p>Kolob, Utah</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>
        <div class="map">
            <iframe src="https://www.google.com/maps?q=Kolob+Canyons,+Utah&output=embed" width="600"
              height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin">
            </iframe>
        </div>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Your name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Your email" required>

                <p>Message Purpose:</p>

                <label for="general">
                    <input type="radio" id="general" name="purpose" value="general" required>
                    General Inquiry
                </label>

                <label for="reservation">
                    <input type="radio" id="reservation" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label for="suggestion">
                    <input type="radio" id="suggestion" name="purpose" value="suggestion">
                    Website Suggestion
                </label>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5"
                  placeholder="Type your message here..." required></textarea>

                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-profiles">

                <figure>
                    <img src="images/employee1.jpg" alt="White Water Rafting Company river guide">
                    <figcaption>River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.jpg"
                      alt="White Water Rafting Company safety coordinator">
                    <figcaption>Safety Coordinator</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.jpg"
                      alt="White Water Rafting Company customer service manager">
                    <figcaption>Customer Service Manager</figcaption>
                </figure>

            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 ◆ White Water Rafting Company ◆ Samson Yakubu</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.jpg" alt="Visit our Facebook page">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.jpg" alt="Visit our Linkedin page">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.jpg" alt="Visit our Instagram page">
            </a>
        </nav>
    </footer>
</body>

</html>
